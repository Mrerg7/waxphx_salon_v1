faq:
  label: "Buyer FAQ"
  title: "Questions Before You Inquire"
  subtitle: "Everything buyers ask before acquiring waxphx.salon:"
  items:
    - question: "Is waxphx.salon actually for sale?"
      answer: "Yes. waxphx.salon is listed for sale by its owner and is available for immediate acquisition. The domain is unlocked, carries a clean title, and transfers to your registrar as soon as escrow confirms the funds."
    - question: "How much does waxphx.salon cost?"
      answer: "The asking price is $50,000 USD. Reasonable offers from qualified buyers are considered, and flexible structures — including escrow-held installment payments — can be discussed for the right project."
    - question: "How do I buy a domain safely?"
      answer: "Every transaction closes through a licensed third-party escrow service. You fund escrow, we release the authorization code, and escrow releases payment only after the domain sits in your registrar account. No wire is sent to a stranger."
    - question: "How long does the transfer take?"
      answer: "Most .SALON transfers complete in 1–5 business days after escrow funding clears. The registrar lock is removed immediately and we assist with every step of the push or transfer."
    - question: "Why is a premium .SALON domain worth investing in?"
      answer: "It combines an exact-match geo keyword (PHX = Phoenix) with a high-intent service keyword (wax) on an industry-specific extension. That delivers instant branding, type-in traffic, and a strong starting position for local SEO in a 5M+ person metro."
    - question: "Can I pay in installments or get a purchase agreement?"
      answer: "Yes. Qualified buyers can request a written purchase agreement with staged payments held in escrow. Email sales@desertrich.com with your intended use and budget range to start the conversation."
    - question: "Who do I contact to make an offer?"
      answer: "Email sales@desertrich.com directly or use the private offer form on this page. All inquiries are handled confidentially with a response within 24 hours."
